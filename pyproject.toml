[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "meridian-services"
version = "0.1.0"
description = "Meridian sensor ecology services"
requires-python = ">=3.11"
dependencies = [
	"aiohttp>=3.9",
	"aiomqtt>=2.0",
	"asyncpg>=0.29",
	"numpy>=1.24",
	"scikit-learn>=1.3",
	"websockets>=11",
]

[tool.setuptools.packages.find]
include = ["services*"]

[tool.unittest]
start-directory = "tests"
pattern = "test_*.py"
