# Sensor Pi (.25) LOCAL mosquitto broker (ADR-003 §1, tier 2).
#
# Edge nodes and local Hailo inference publish here. The spool service
# (services/spool) subscribes, journals to SQLite, and forwards UPSTREAM to
# Inferno — so this broker does NOT bridge; it is a plain local broker. The
# spool owns durability and forwarding (see services/spool/__main__.py).
#
# No persistence directives here: Debian's default mosquitto.conf already sets
# persistence true + persistence_location, and duplicating them makes mosquitto
# fail to start. The Pi broker needs no durable queue anyway — the SQLite spool
# (services/spool) is the durability layer.
#
# Install: sudo cp deploy/mosquitto-pi.conf /etc/mosquitto/conf.d/meridian.conf
#          sudo systemctl restart mosquitto
listener 1883
allow_anonymous true        # one trusted home; per-node ACLs are deferred (ADR-003 §4)
